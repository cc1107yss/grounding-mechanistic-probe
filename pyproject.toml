[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic-probe-reproduction"
version = "0.1.0"
description = "Frozen-Qwen conceptual reproduction of MechanisticProbe on ProofWriter"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.18",
  "huggingface-hub>=0.23",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.1",
  "transformers>=4.40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
